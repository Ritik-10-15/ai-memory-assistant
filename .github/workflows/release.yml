name: Release artifacts

# Builds versioned, downloadable artifacts after every check passes. It
# publishes nothing and deploys nothing: deployment stays a deliberate,
# manual step (docs/DEPLOYMENT_GUIDE.md, "Releasing a new version").
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  artifacts:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the public demo (static site)
        working-directory: frontend
        run: |
          npm ci
          npm run build:demo

      - name: Version
        id: version
        run: echo "name=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload the public demo site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-demo-${{ steps.version.outputs.name }}
          path: frontend/dist-demo
          retention-days: 30

      - name: Build and save the private app image (not pushed to any registry)
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t memory-assistant:${GITHUB_SHA::7} .
          docker save memory-assistant:${GITHUB_SHA::7} | gzip > memory-assistant-${{ steps.version.outputs.name }}.tar.gz
          sha256sum memory-assistant-*.tar.gz > SHA256SUMS

      - name: Upload the private app image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-image-${{ steps.version.outputs.name }}
          path: |
            memory-assistant-*.tar.gz
            SHA256SUMS
          retention-days: 14

name: Public demo (GitHub Pages)

# Publishes the public portfolio demo — the static build from
# `npm run build:demo`: homepage, simulated demo and fictional albums only;
# no backend, no patient data — to GitHub Pages. Needs Pages turned on once:
# Settings → Pages → Source: GitHub Actions. The private app is never
# published by this workflow.
on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pages settings
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build the public demo for this site's path
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build:demo

      - name: Check it in a browser before publishing (no API, no camera, accessibility)
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.demo.config.ts

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to Pages
      id-token: write   # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Private application on one machine (Docker Desktop, a home server, a
# laptop next to the patient's screen). Only this machine can reach it:
# the port is bound to 127.0.0.1. Settings come from .env (copy .env.example).
#
#   docker compose up -d --build            → http://localhost:8000
#   docker compose --profile demo up -d     → public demo on http://localhost:8080
#
# http://localhost counts as a secure page, so the browser camera works
# without HTTPS here. Any other address needs HTTPS (see docs/DEPLOYMENT_GUIDE.md).
name: memory-assistant

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: memory-assistant:${APP_VERSION:-local}
    env_file: .env
    environment:
      CAMERA_MODE: browser
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - memory_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: memory-assistant-demo:${APP_VERSION:-local}
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  memory_data:   # DB, enrolled faces, family photos, uploads, embedding cache — back it up

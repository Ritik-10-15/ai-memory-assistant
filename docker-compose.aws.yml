# Single-instance AWS deployment (see aws/free-tier-ec2.yaml and DEPLOY_AWS.md).
# Caddy terminates HTTPS — browsers only allow camera access on HTTPS pages —
# with an automatic Let's Encrypt certificate for SITE_ADDRESS (the public IP).
services:
  app:
    build: .
    env_file: .env.aws
    volumes:
      - memory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2.10.0-alpine
    env_file: .env.site
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  memory_data:   # DB, enrolled faces, uploads, embedding cache
  caddy_data:    # TLS certificates

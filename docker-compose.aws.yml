# Single-instance AWS deployment (see aws/free-tier-ec2.yaml and docs/DEPLOYMENT_GUIDE.md).
# Caddy terminates HTTPS — browsers only allow camera access on HTTPS pages —
# with an automatic Let's Encrypt certificate for SITE_ADDRESS (the public IP).
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # One image per commit, so aws/deploy.sh can return to the previous one.
    image: memory-assistant:${APP_VERSION:-dev}
    env_file: .env.aws
    environment:
      SECURE_COOKIES: "1"   # served only over HTTPS (Caddy)
      TRUST_PROXY: "1"      # real client IPs for login throttling
    volumes:
      - memory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11.6-alpine
    env_file: .env.site
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      app:
        condition: service_healthy

volumes:
  memory_data:   # DB, enrolled faces, uploads, embedding cache
  caddy_data:    # TLS certificates

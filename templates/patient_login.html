<!-- patient_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8f7f4;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  padding:40px 36px;width:100%;max-width:380px;text-align:center}
.icon{font-size:40px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
p{font-size:14px;color:#6b7280;margin-bottom:28px}
input[type="password"]{width:100%;border:1px solid #e5e7eb;border-radius:10px;
  padding:12px 14px;font-size:16px;outline:none;margin-bottom:14px;
  transition:border-color .15s;font-family:inherit}
input:focus{border-color:#16a34a}
button{width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;
  padding:13px;font-size:16px;font-weight:700;cursor:pointer}
.flash{color:#b91c1c;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🧠</div>
  <h1>Set up this screen</h1>
  <p>Enter the patient PIN once. This device will stay signed in.</p>
  {% with msgs=get_flashed_messages() %}{% if msgs %}
    <div class="flash">{{ msgs[0] }}</div>
  {% endif %}{% endwith %}
  <form method="POST">
    <input type="password" name="pin" placeholder="PIN" inputmode="numeric" autofocus required>
    <button type="submit">Continue</button>
  </form>
</div>
</body>
</html>

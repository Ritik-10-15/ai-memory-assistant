<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Assistant</title>
<style>
:root {
  --bg: #f8f7f4; --card: #fff; --border: #e5e7eb;
  --text: #1a1a1a; --muted: #6b7280; --hint: #9ca3af;
  --green: #16a34a; --green-bg: #dcfce7; --green-text: #166534;
  --amber: #d97706; --amber-bg: #fef3c7; --amber-text: #92400e;
  --radius: 16px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #111827; --card: #1f2937; --border: #374151;
  --text: #f9fafb; --muted: #9ca3af; --hint: #6b7280;
  --green-bg: #064e3b; --green-text: #6ee7b7;
  --amber-bg: #451a03; --amber-text: #fcd34d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:grid;grid-template-rows:auto auto 1fr auto;
  grid-template-columns:1fr 400px;transition:background .3s,color .3s}

/* Header */
header{grid-column:1/-1;background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;background:var(--green);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
header h1{font-size:18px;font-weight:700}
.header-right{display:flex;align-items:center;gap:14px}
#clock{font-size:15px;color:var(--muted);font-weight:500}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;cursor:pointer;color:var(--muted);font-size:16px;
  transition:border-color .2s}
.theme-btn:hover{border-color:var(--green)}

/* Recent strip */
#recent-strip{grid-column:1/-1;background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;align-items:center;gap:10px;overflow-x:auto;min-height:40px}
#recent-strip strong{font-size:12px;color:var(--hint);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.r-chip{padding:3px 12px;border-radius:999px;background:var(--bg);
  border:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap}

/* Camera */
#cam-panel{padding:20px;display:flex;flex-direction:column;gap:12px}
#vid-wrap{position:relative;border-radius:var(--radius);overflow:hidden;
  background:#0a0a0a;aspect-ratio:4/3;box-shadow:var(--shadow)}
#vid-feed{width:100%;height:100%;object-fit:cover;display:block}
#status-pill{position:absolute;top:12px;left:12px;padding:5px 14px;
  border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);
  transition:background .4s}
#status-pill.high{background:rgba(22,163,74,.85)}
#status-pill.medium{background:rgba(217,119,6,.85)}
#status-pill.unknown{background:rgba(185,28,28,.85)}
#conf-bar-wrap{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
#conf-bar{height:100%;width:0;background:var(--green);border-radius:2px;
  transition:width .4s,background .4s}
#conf-bar.medium{background:var(--amber)}

/* Stats bar */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center}
.stat-box .sv{font-size:22px;font-weight:700;color:var(--green)}
.stat-box .sl{font-size:11px;color:var(--hint);text-transform:uppercase;
  letter-spacing:.06em;margin-top:2px}

/* Info panel */
#info-panel{background:var(--card);border-left:1px solid var(--border);
  padding:24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}

#idle-state{text-align:center;padding:48px 20px;color:var(--hint)}
#idle-state .idle-icon{font-size:52px;margin-bottom:16px;opacity:.4}
#idle-state p{font-size:17px;line-height:1.7}

#person-card{display:none;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.badge{display:inline-block;padding:4px 12px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.high{background:var(--green-bg);color:var(--green-text)}
.badge.medium{background:var(--amber-bg);color:var(--amber-text)}
.badge.unknown{background:#fee2e2;color:#b91c1c}

#person-name{font-size:36px;font-weight:800;line-height:1.15;margin-top:6px;
  color:var(--text)}
#person-relation{font-size:18px;color:var(--muted);margin-top:2px}

.emotion-row{display:flex;align-items:center;gap:8px;font-size:14px;
  color:var(--hint);margin-top:4px}
.emotion-dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}

.info-block{background:var(--bg);border-radius:12px;padding:14px 16px;
  border:1px solid var(--border)}
.info-block label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--hint);display:block;margin-bottom:6px}
.info-block p{font-size:16px;line-height:1.6;color:var(--text)}

/* Memory recall (patient-controlled) */
#mem-block .recall-controls{display:flex;gap:8px;margin-top:12px}
.recall-btn{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 14px;border-radius:10px;font-size:15px;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--text);transition:opacity .15s,transform .1s,border-color .15s,background .15s}
.recall-btn:active{transform:scale(.97)}
.recall-btn.primary{background:var(--green);color:#fff;border-color:var(--green);flex:1}
.recall-btn.stop{background:#fee2e2;color:#b91c1c;border-color:#fecaca;flex:1}
.recall-btn.ghost{color:var(--muted)}
.recall-btn.ghost:hover{border-color:var(--green);color:var(--green)}
.recall-btn:disabled{opacity:.5;cursor:default}
.speaking-hint{font-size:12px;color:var(--hint);margin-top:8px;text-align:center;
  min-height:16px}
.speaking .info-block{border-color:var(--green)}

/* Recent memories list (recap of last few) */
#recap-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.recap-item{font-size:14px;line-height:1.5;color:var(--muted);
  padding-left:12px;border-left:2px solid var(--border)}
.recap-item .when{display:block;font-size:11px;color:var(--hint);margin-top:2px}

/* Memory section (add) */
.mem-section{border-top:1px solid var(--border);padding-top:18px}
.mem-section h3{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--hint);margin-bottom:12px}
#mem-input{width:100%;border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;font-size:15px;font-family:inherit;resize:vertical;
  min-height:76px;color:var(--text);background:var(--card);outline:none;
  transition:border-color .15s}
#mem-input:focus{border-color:var(--green)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;border:none;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:#fee2e2;color:#b91c1c}
.btn-red.recording{background:#b91c1c;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}
#save-msg{font-size:13px;color:var(--green);font-weight:600;
  text-align:center;min-height:20px;margin-top:6px}

/* Footer */
footer{grid-column:1/-1;background:var(--card);border-top:1px solid var(--border);
  padding:10px 24px;display:flex;justify-content:space-between;
  font-size:12px;color:var(--hint)}
footer a{color:var(--hint);text-decoration:none}
footer a:hover{color:var(--text)}

@media(max-width:700px){
  body{grid-template-columns:1fr}
  #info-panel{border-left:none;border-top:1px solid var(--border)}
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo">🧠</div>
    <h1>Memory Assistant</h1>
  </div>
  <div class="header-right">
    <div id="clock"></div>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <a href="/caregiver" style="font-size:13px;color:var(--muted);text-decoration:none">
      Caregiver →
    </a>
  </div>
</header>

<div id="recent-strip">
  <strong>Today</strong>
  <span id="recent-list" style="display:flex;gap:6px"></span>
</div>

<!-- Camera -->
<div id="cam-panel">
  <div id="vid-wrap">
    <img id="vid-feed" src="/video" alt="Camera">
    <div id="status-pill">Looking…</div>
  </div>
  <div id="conf-bar-wrap"><div id="conf-bar"></div></div>
  <div class="stats-row">
    <div class="stat-box"><div class="sv" id="s-people">–</div><div class="sl">People</div></div>
    <div class="stat-box"><div class="sv" id="s-today">–</div><div class="sl">Today</div></div>
    <div class="stat-box"><div class="sv" id="s-memories">–</div><div class="sl">Memories</div></div>
  </div>
</div>

<!-- Info panel -->
<div id="info-panel">
  <div id="idle-state">
    <div class="idle-icon">👁️</div>
    <p>Point the camera at a face.<br>I'll help you remember who it is.</p>
  </div>

  <div id="person-card">
    <span id="cert-badge" class="badge">–</span>
    <div id="person-name">–</div>
    <div id="person-relation">–</div>
    <div class="emotion-row" id="emotion-row" style="display:none">
      <div class="emotion-dot"></div>
      <span>Appears <strong id="emotion-label">–</strong></span>
    </div>

    <div class="info-block" id="notes-block" style="display:none">
      <label>About this person</label>
      <p id="notes-text">–</p>
    </div>

    <!-- Last conversation: text always visible, audio is optional -->
    <div class="info-block" id="mem-block" style="display:none">
      <label>Last time you spoke</label>
      <p id="mem-text">–</p>

      <div class="recall-controls" id="recall-controls">
        <button class="recall-btn primary" id="play-btn" onclick="playRecap()">
          ▶ Read this to me
        </button>
        <button class="recall-btn ghost" id="replay-btn" onclick="playRecap()"
                title="Play again" style="display:none">↺ Again</button>
      </div>
      <div class="speaking-hint" id="speaking-hint"></div>

      <!-- Earlier conversations (recap of the last few) -->
      <div id="recap-list"></div>
    </div>

    <div class="mem-section">
      <h3>Add a memory</h3>
      <textarea id="mem-input" placeholder="What did you talk about today?"></textarea>
      <div class="btn-row">
        <button class="btn btn-green" onclick="saveMemory()">Save memory</button>
        <button class="btn btn-red" id="rec-btn" onclick="toggleRec()">🎙 Record</button>
      </div>
      <div id="save-msg"></div>
    </div>
  </div>
</div>

<footer>
  <span>AI Memory Assistant v3.0 — Alzheimer's Support</span>
  <a href="/caregiver/analytics">View analytics →</a>
</footer>

<script>
let currentPid = null, currentName = null, mediaRec = null,
    audioChunks = [], isRec = false;

// Recall state
let lastMemoryText = "";       // the most recent summary (what we speak)
let recapMemories  = [];       // last few, for the earlier-conversations list
let isSpeaking     = false;

// Clock
function tick() {
  const n = new Date();
  document.getElementById("clock").textContent =
    n.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}) +
    "  " + n.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
}
tick(); setInterval(tick, 1000);

// Dark mode
function toggleTheme() {
  const d = document.documentElement;
  const t = d.getAttribute("data-theme") === "dark" ? "light" : "dark";
  d.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
  document.querySelector(".theme-btn").textContent = t === "dark" ? "☀️" : "🌙";
}
const saved = localStorage.getItem("theme");
if (saved) {
  document.documentElement.setAttribute("data-theme", saved);
  document.querySelector(".theme-btn").textContent = saved === "dark" ? "☀️" : "🌙";
}

// ── SPEECH (patient-controlled recall) ──────────────────────────
// Uses the browser's built-in speechSynthesis so the patient can stop
// mid-sentence instantly and replay on demand. No server round-trip.

function trimForSpeech(text, maxChars = 400) {
  // Keep spoken recall short and calm. If a memory is very long (e.g. a
  // rambling transcript), speak the first sentence or two rather than
  // droning on — the full text stays visible on screen to read.
  if (!text) return "";
  if (text.length <= maxChars) return text;
  const cut = text.slice(0, maxChars);
  const lastStop = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "),
                            cut.lastIndexOf("? "));
  return (lastStop > 80 ? cut.slice(0, lastStop + 1) : cut) + " …";
}

function playRecap() {
  if (!("speechSynthesis" in window)) {
    setHint("Audio isn't supported in this browser — you can read it above.");
    return;
  }
  if (!lastMemoryText) return;
  // Cancel anything already speaking so pressing play twice doesn't stack.
  window.speechSynthesis.cancel();

  const who = currentName ? currentName.replace(/\b\w/g, c => c.toUpperCase()) : "this person";
  const preamble = `Last time you spoke with ${who}. `;
  const utter = new SpeechSynthesisUtterance(preamble + trimForSpeech(lastMemoryText));
  utter.rate  = 0.95;   // slightly slower — easier to follow
  utter.pitch = 1.0;

  utter.onstart = () => { isSpeaking = true;  setSpeakingUI(true); };
  utter.onend   = () => { isSpeaking = false; setSpeakingUI(false); };
  utter.onerror = () => { isSpeaking = false; setSpeakingUI(false); };

  window.speechSynthesis.speak(utter);
}

function stopRecap() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  isSpeaking = false;
  setSpeakingUI(false);
}

function setHint(msg) {
  document.getElementById("speaking-hint").textContent = msg || "";
}

function setSpeakingUI(speaking) {
  const playBtn   = document.getElementById("play-btn");
  const replayBtn = document.getElementById("replay-btn");
  const memBlock  = document.getElementById("mem-block");
  if (speaking) {
    memBlock.classList.add("speaking");
    playBtn.className = "recall-btn stop";
    playBtn.textContent = "■ Stop";
    playBtn.setAttribute("onclick", "stopRecap()");
    replayBtn.style.display = "none";
    setHint("Reading aloud… tap Stop when you remember.");
  } else {
    memBlock.classList.remove("speaking");
    playBtn.className = "recall-btn primary";
    playBtn.textContent = "▶ Read this to me";
    playBtn.setAttribute("onclick", "playRecap()");
    replayBtn.style.display = "";   // offer replay once they've heard it once
    setHint("");
  }
}

// ── DETECTION POLL ──────────────────────────────────────────────
async function poll() {
  try {
    const d = await fetch("/api/current-person").then(r=>r.json());
    updateUI(d);
  } catch(e) {}
  setTimeout(poll, 700);
}

function updateUI(d) {
  const idle  = document.getElementById("idle-state");
  const card  = document.getElementById("person-card");
  const pill  = document.getElementById("status-pill");
  const bar   = document.getElementById("conf-bar");
  const state = d.state;

  // Confidence bar
  const pct = Math.round((d.confidence||0)*100);
  bar.style.width = pct + "%";
  bar.className   = state === "medium" ? "medium" : "";

  // If nobody's here (idle) or the person changed, stop any speech so it
  // never keeps talking to an empty room or over the next visitor.
  if (!d.name || state === "idle" || d.person_id !== currentPid) {
    if (isSpeaking) stopRecap();
  }

  if (!d.name || state === "idle" || state === "unknown") {
    idle.style.display = (state === "unknown") ? "none" : "block";
    // For an unknown face, show the card in a minimal "unknown" form.
    if (state === "unknown") {
      card.style.display = "block";
      document.getElementById("cert-badge").textContent = "Unknown";
      document.getElementById("cert-badge").className = "badge unknown";
      document.getElementById("person-name").textContent = d.display_message || "Unknown person";
      document.getElementById("person-relation").textContent = "";
      document.getElementById("notes-block").style.display = "none";
      document.getElementById("mem-block").style.display = "none";
      pill.textContent = "Unknown";
      pill.className = "unknown";
    } else {
      card.style.display = "none";
      pill.textContent   = "Looking…";
      pill.className     = "";
    }
    currentPid = null; currentName = null;
    lastMemoryText = ""; recapMemories = [];
    return;
  }

  idle.style.display = "none";
  card.style.display = "block";

  const personChanged = d.person_id !== currentPid;
  currentPid  = d.person_id;
  currentName = d.name;

  // Badge + pill
  const badge = document.getElementById("cert-badge");
  badge.textContent = d.certainty_label || "";
  badge.className   = `badge ${state}`;
  pill.textContent  = state==="high" ? "✓ Recognized" : "Checking…";
  pill.className    = state;

  document.getElementById("person-name").textContent     = d.display_message || d.name;
  document.getElementById("person-relation").textContent = d.relationship || "";

  // Emotion
  const eRow = document.getElementById("emotion-row");
  if (d.emotion && state==="high") {
    eRow.style.display = "flex";
    document.getElementById("emotion-label").textContent = d.emotion;
  } else { eRow.style.display = "none"; }

  // Notes
  const nb = document.getElementById("notes-block");
  if (d.notes) { nb.style.display="block"; document.getElementById("notes-text").textContent=d.notes; }
  else nb.style.display="none";

  // Last memory (text always visible) + audio recall controls
  const mb = document.getElementById("mem-block");
  if (d.last_memory) {
    mb.style.display = "block";
    document.getElementById("mem-text").textContent = d.last_memory;
    lastMemoryText = d.last_memory;

    // Reset recall UI when a NEW person appears (don't leave a Stop button
    // from a previous visitor, and re-offer the calm Play button).
    if (personChanged) { stopRecap();
      document.getElementById("replay-btn").style.display = "none"; }

    // Earlier conversations recap (last few, excluding the top one already shown)
    recapMemories = Array.isArray(d.recent_memories) ? d.recent_memories : [];
    renderRecap();
  } else {
    mb.style.display = "none";
    lastMemoryText = ""; recapMemories = [];
  }
}

function renderRecap() {
  const box = document.getElementById("recap-list");
  box.innerHTML = "";
  // Skip index 0 — that's the "last time you spoke" already shown above.
  const earlier = recapMemories.slice(1);
  if (!earlier.length) return;
  const heading = document.createElement("label");
  heading.style.cssText = "font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--hint);display:block;margin:4px 0 4px";
  heading.textContent = "Earlier conversations";
  box.appendChild(heading);
  for (const m of earlier) {
    const item = document.createElement("div");
    item.className = "recap-item";
    const summary = document.createElement("span");
    summary.textContent = m.summary || "";
    item.appendChild(summary);
    if (m.when) {
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = formatWhen(m.when);
      item.appendChild(when);
    }
    box.appendChild(item);
  }
}

function formatWhen(s) {
  // Backend sends SQLite datetime like "2026-07-07 20:05:34"; show a
  // friendly date. Fall back to the raw string if parsing fails.
  try {
    const d = new Date(s.replace(" ", "T"));
    if (isNaN(d)) return s;
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  } catch(e) { return s; }
}

// ── SAVE MEMORY ─────────────────────────────────────────────────
async function saveMemory() {
  const text = document.getElementById("mem-input").value.trim();
  if (!text) return;
  const msg = document.getElementById("save-msg");
  const r = await fetch("/api/save-memory",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({person_id: currentPid, summary: text})
  });
  const d = await r.json();
  if (d.message) {
    msg.style.color = "var(--green)";
    msg.textContent = "✓ Memory saved!";
    document.getElementById("mem-input").value = "";
    setTimeout(()=>msg.textContent="", 3000);
  } else {
    msg.textContent = d.error || "Could not save.";
    msg.style.color = "#b91c1c";
  }
}

// ── VOICE RECORD ────────────────────────────────────────────────
async function toggleRec() {
  const btn = document.getElementById("rec-btn");
  if (!isRec) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRec = new MediaRecorder(stream);
      audioChunks = [];
      mediaRec.ondataavailable = e => audioChunks.push(e.data);
      mediaRec.onstop = uploadAudio;
      mediaRec.start();
      isRec = true;
      btn.textContent = "⏹ Stop";
      btn.classList.add("recording");
    } catch(e) { alert("Microphone access denied."); }
  } else {
    mediaRec.stop();
    mediaRec.stream.getTracks().forEach(t=>t.stop());
    isRec = false;
    btn.textContent = "🎙 Record";
    btn.classList.remove("recording");
  }
}
async function uploadAudio() {
  const msg = document.getElementById("save-msg");
  msg.style.color = "var(--green)";
  if (!audioChunks.length) {
    msg.style.color = "#b91c1c";
    msg.textContent = "⚠️ Nothing was recorded — try again.";
    setTimeout(()=>msg.textContent="", 5000);
    return;
  }
  if (!currentPid) {
    msg.style.color = "#b91c1c";
    msg.textContent = "⚠️ No one recognized yet — wait for a name before recording.";
    setTimeout(()=>msg.textContent="", 6000);
    return;
  }
  const blob = new Blob(audioChunks, {type:"audio/webm"});
  const form = new FormData();
  form.append("audio", blob, "rec.webm");
  form.append("person_id", currentPid);
  msg.textContent = "🎙 Transcribing…";
  try {
    const res = await fetch("/api/upload-audio", {method:"POST", body:form});
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      msg.style.color = "#b91c1c";
      msg.textContent = "⚠️ Upload failed: " + (err.error || res.status);
    } else {
      msg.textContent = "🎙 Transcribing… (saved to " + (currentName || "this person") + ")";
    }
  } catch(e) {
    msg.style.color = "#b91c1c";
    msg.textContent = "⚠️ Upload error — is the app still running?";
  }
  setTimeout(()=>msg.textContent="", 6000);
}

// ── STATS / RECENT ──────────────────────────────────────────────
async function loadStats() {
  try {
    const s = await fetch("/api/stats").then(r=>r.json());
    document.getElementById("s-people").textContent   = s.total_people;
    document.getElementById("s-today").textContent    = s.today_visits;
    document.getElementById("s-memories").textContent = s.total_memories;
  } catch(e) {}
}

async function loadRecent() {
  try {
    const data = await fetch("/api/recent-visits").then(r=>r.json());
    const list = document.getElementById("recent-list");
    const seen = new Set();
    list.innerHTML = "";
    for (const v of data) {
      if (!seen.has(v.name)) {
        seen.add(v.name);
        const c = document.createElement("span");
        c.className = "r-chip";
        c.textContent = v.name;
        list.appendChild(c);
      }
    }
  } catch(e) {}
}

// Stop speech if the page is hidden/closed (don't talk to nobody).
document.addEventListener("visibilitychange", () => {
  if (document.hidden && isSpeaking) stopRecap();
});

poll();
loadStats();
loadRecent();
setInterval(loadStats,  15000);
setInterval(loadRecent, 30000);
</script>
